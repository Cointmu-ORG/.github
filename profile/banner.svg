<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">CointMU</title>
  <desc id="d">A private Proof-of-Work blockchain network. An animated chain of mined blocks scrolls past.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1613"/>
      <stop offset="1" stop-color="#14382d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe0b8"/>
      <stop offset="1" stop-color="#3c8772"/>
    </linearGradient>
    <linearGradient id="blockFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4a3b"/>
      <stop offset="1" stop-color="#10291f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3c8772" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <mask id="chainMask" maskUnits="userSpaceOnUse" x="540" y="0" width="660" height="320">
      <rect x="540" y="0" width="660" height="320" fill="url(#fade)"/>
    </mask>
    <g id="block">
      <rect width="130" height="126" rx="14" fill="url(#blockFill)" stroke="#3c8772" stroke-width="1.5"/>
      <rect width="130" height="30" rx="14" fill="url(#accent)" opacity="0.9"/>
      <rect y="16" width="130" height="14" fill="url(#accent)" opacity="0.9"/>
      <text x="14" y="21" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#0b1613">BLOCK</text>
      <text x="14" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8fd4bd">hash</text>
      <text x="14" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8fff6">0000a3f9…</text>
      <text x="14" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8fd4bd">nonce</text>
      <text x="14" y="114" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#e8fff6">0x5be1…</text>
    </g>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g mask="url(#chainMask)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-170 0" dur="5s" repeatCount="indefinite"/>
      <line x1="560" y1="163" x2="1500" y2="163" stroke="#3c8772" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/>
      <use href="#block" x="560" y="100"/>
      <use href="#block" x="730" y="100"/>
      <use href="#block" x="900" y="100"/>
      <use href="#block" x="1070" y="100"/>
      <use href="#block" x="1240" y="100"/>
      <use href="#block" x="1410" y="100"/>
    </g>
  </g>

  <g>
    <circle cx="1150" cy="56" r="6" fill="#6fe0b8"/>
    <circle cx="1150" cy="56" r="6" fill="none" stroke="#6fe0b8" stroke-width="2">
      <animate attributeName="r" values="6;22" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1128" y="62" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8fd4bd">mining…</text>
  </g>

  <text x="60" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="800" fill="#ffffff">Coint<tspan fill="#6fe0b8">MU</tspan></text>
  <text x="62" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#cdeee1">A private Proof-of-Work blockchain network</text>
  <text x="62" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8fb8a9">Build · Mine · Explore. Made at Arcanists</text>

  <rect x="62" y="248" width="348" height="34" rx="17" fill="url(#accent)"/>
  <text x="236" y="270" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1613">Chain ID 1912 · Ethash · Geth 1.10.26</text>
</svg>
